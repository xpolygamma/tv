<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>qTV</title>
	
	<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">
	<style>
:root {
	--u: 1.2vw;

	--bg: #47474977;
	--bg-h: #6b6b6d77;
	--border: #fafaff1a;
	--border-h: #fafaff22;
	--hover: #fafaff11;
}
*[hidden] {
	display: none !important;
}

body {
	margin: 0;
	background: #000;
	overflow: none;
}
body::-webkit-scrollbar {
	display: none;
}

.glass {
	height: var(--h);
	background-color: var(--bg);
	border: calc(0.07 * var(--h)) solid var(--border);
	border-radius: calc(0.2 * var(--h));
	transition: .2s;
	box-sizing: border-box;

	&:hover {
		background-color: var(--bg-h);
		border-color: var(--border-h);
	}
}

.select {
	display: grid;
	grid-template-rows: 1fr 3fr;
	height: var(--h);

	.choice {
		position: relative;
		width: 100%;
		background-size: cover;
		background-position: center;
		background-repeat: no-repeat;
		
		font-size: calc(0.4 * var(--h));
		color: #fff;
		text-align: left;
		padding-left: calc(0.2 * var(--h));
		
		p {
			width: 0;
			white-space: nowrap;
			margin-block-start: 0 !important;
			margin-block-end: 0 !important;
		}
		svg {
			position: absolute;
			top: calc(0.05 * var(--h));
			right: calc(0.05 * var(--h));
			width: calc(0.8 * var(--h));
			height: calc(0.8 * var(--h));

			path {
				stroke: #fff;
			}
		}
	}
	.options {
		position: relative;
		z-index: 2;
		width: 100%;
		height: calc(3 * var(--h));
		overflow-x: hidden;
		overflow-y: scroll;
		border-radius: calc(0.2 * var(--h));
		background: var(--bg);
		backdrop-filter: blur(calc(.2 * var(--h)));

		.option {
			position: relative;
			width: 100%;
			height: var(--h);
			background: none;
			border: none;
			border-radius: 0;
			background-position: center;
			background-repeat: no-repeat;
			background-size: cover;
			transition: .2s;
			font-size: calc(0.4 * var(--h));
			color: #fff;
			text-align: left;
			padding-left: calc(0.2 * var(--h));
			white-space: nowrap;

			&:hover {
				background: var(--hover);
			}
		}
	}
}

b {
	font-weight: 700;
	background: linear-gradient(to bottom, #70f 40%, #a0f);
	background-clip: text;
	-webkit-background-clip: text;
	color: transparent !important;
	-webkit-text-fill-color: transparent !important;
}
#change-server {
	width: calc(20 * var(--u));
}
#player {
	width: 100vw;
	height: 100dvh;

	display: flex;
	flex-direction: column;
}
#iframe {
	height: 100%;
}
#top h1, #url {
	font-family: Arial;
	font-size: calc(2 * var(--u));
	margin: 0;
	color: #fff;
}
#top h1::selection, #url::selection, b::selection {
	background: #fff5;
}
#top {
	display: flex;
	align-items: center;
	gap: calc(.5 * var(--u));

	height: calc(6.1 * var(--u));
	padding: calc(.5 * var(--u));
	padding-right: calc(1 * var(--u));
	box-sizing: border-box;
	--h: calc(5 * var(--u));

	h1 {
		padding: calc(1 * var(--u));
		padding-top: calc(1.01 * var(--u));
		padding-bottom: 0;
		text-align: center;
	}
	a {
		text-decoration: none;
	}
}
#url {
	margin-left: auto;
	text-align: right;
}

#home {
	width: 100vw;
	height: 100dvh;

	display: flex;
	flex-direction: column;
	align-items: center;

	h1 {
		font-size: calc(5 * var(--u));
		color: #fff;
		font-family: "Syne";
		font-weight: 800;

		&::selection {
			background: #fff5;
		}
	}
	#search {
		width: 90%;
		font-size: calc(4 * var(--u));
		padding: calc(2 * var(--u)) calc(3 * var(--u));
		box-sizing: border-box;

		color: #fff;

		background: #141415;
		border: calc(.2 * var(--u)) solid #333335;

		border-radius: calc(10 * var(--u));
		transition: .4s;

		&:focus {
			outline: none;
			border-color: #50f;
		}
		&::selection {
			background: #50f;
			color: #fff;
		}
	}
	#results {
		width: 90%;
		height: 100%;
		margin-top: calc(1 * var(--u));
		margin-bottom: calc(5 * var(--u));
		box-sizing: border-box;

		/* border: 1px solid red; */

		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
		gap: calc(1 * var(--u));

		.title {
			width: 100%;
			text-decoration: none;

			img {
				width: 100%;
				aspect-ratio: 2/3;
				border-radius: calc(.5 * var(--u));
				transition: .2s;
			}
			&:hover img {
				transform: scale(1.02);
			}
			h2, p {
				margin: 0;
				font-family: Arial;
				color: #fff;

				white-space: pre-wrap;
				word-wrap: break-word;

				&::selection {
					background: #fff5;
				}
			}
			h2 {
				font-size: calc(2 * var(--u));
				margin-top: calc(.5 * var(--u));
			}
			p {
				font-size: calc(1.5 * var(--u));
				margin-top: calc(.5 * var(--u));
			}
		}
	}
}

@media only screen and (min-aspect-ratio: 1/1) {
	:root {
		--u: 1vh;
	}
	#home #results {
		grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
	}
}
	</style>
</head>
<body>
	<div id="home" hidden>
		<h1>movie.bike</h1>
		<input type="text" id="search" oninput="debounce()" placeholder="Search...">
		<div id="results"></div>
	</div>

	<div id="player" hidden>
		<div id="top">
			<a href="/"><h1 class="glass">qTV</h1></a>
			<div id="change-server" class="select">
				<button class="choice glass" onclick="select(this)">
					<p id="selected-server">Loading...</p>
					<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g><path d="M7 10L12 15L17 10" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
				</button>
				<div id="serverlist" class="options" hidden>
				</div>
			</div>
			<p id="url">movie.bike?<b id="code">[ Loading... ]</b></p>
		</div>
		<iframe id="iframe" src="" frameborder="0" allowfullscreen allow="encrypted-media"></iframe>
	</div>

	<script>
		const parts = window.location.search.slice(1).split('-');
		let code = parts[0].replace(/[^0-9]/g, '');
		let db = 't';
		if (parts[0].startsWith('tt')) {
			db = 'i';
			code = 'tt'+code;
		}

		if (code) document.getElementById('player').hidden = false;
		else document.getElementById('home').hidden = false;

		// let key = localStorage.getItem('key');
		// while (!key) key = prompt('Enter key:');
		// localStorage.setItem('key', key);

		function api(url) {
			// let key = localStorage.getItem('key');
			// while (!key) key = prompt('Enter key:');
			// localStorage.setItem('key', key);
			// {
			// 	method: 'POST',
			// 	headers: { 'Content-Type': 'application/json' },
			// 	body: JSON.stringify({ key })
			// }

			return fetch((window.cfg?.url || 'https://api.movie.bike')+url).then(r => r.json()).then(r => {
				if (r.key === false) {
					localStorage.removeItem('key');
					document.documentElement.innerHTML = '';
					window.location.href = 'about:blank';
				}
			}).catch(console.error);
		}

		function select(ele) {
			const options = ele.parentElement.querySelector('.options');
			options.hidden = false;
			window.addEventListener('pointerdown', e => {
				if (!ele.contains(e.target) && !options.contains(e.target)) {
					options.hidden = true;
				}
			}, { once: true });
		}
		window.addEventListener('blur', () => {
			if (document.activeElement instanceof HTMLIFrameElement) {
				document.querySelectorAll('.options').forEach(e => e.hidden = true);
			}
		});

		const searchInput = document.getElementById('search');
		const resultsList = document.getElementById('results');
		async function search(iquery=null, page=null) {
			const query = iquery || searchInput.value;
			if (!query) {
				if (!page) resultsList.innerHTML = '';
				return;
			}

			const resp = await api(`/search?q=${encodeURIComponent(query)}&p=${page || 1}`);
			if (resp?.success) {
				if (!page) resultsList.innerHTML = '';
				else {}

				resp.results.forEach(r => {
					const t = document.createElement('a');
					t.classList.add('title');
					t.href = `/${r[3] === 'tv' ? 'tv' : ''}?${r[0]}`;

					const img = document.createElement('img');
					if (r[2]) img.src = `https://media.themoviedb.org/t/p/w220_and_h330_face${r[2]}`;
					const h2 = document.createElement('h2');
					h2.innerText = r[1];
					const p = document.createElement('p');
					if (r[4]) p.innerText = new Date(r[4]).toLocaleDateString('en-GB', {
						day: 'numeric',
						month: 'short',
						year: 'numeric'
					});
					t.replaceChildren(img, h2, p);

					resultsList.appendChild(t);
				});

				if (resp.more) {}
			}
		}
		let searchRequest;
		function debounce() {
			clearTimeout(searchRequest);
			searchRequest = setTimeout(search, 400);
		}

		/////

		const dbName = {
			't': 'tmdb',
			'i': 'imdb'
		}[db];

		document.getElementById('code').innerText = code;

		let SITES = [];
		const ACCENT = '6400FF';

		const serverlist = document.getElementById('serverlist');
		const selected = document.getElementById('selected-server');
		const iframe = document.getElementById('iframe');
		let curserver = 0;
		function server(i) {
			serverlist.hidden = true;
			selected.innerText = SITES[i][0];
			iframe.src = SITES[i][1]
				.replace('{id}', code)
				.replace('{accent}', ACCENT)
				.replace('{db}', dbName);
			curserver = i;
		}

		async function init(sites) {
			SITES.push(...sites.filter(s => s[0].includes(db)).map(s => [s[1], s[2]]));
			initList(serverlist, SITES.entries(), s => s[1][0], s => s[0], server, true);
			server(0);
		}

		function initList(list, array, name, value, func, append=false) {
			if (!append) list.innerHTML = '';
			for (const i of array) {
				const btn = document.createElement('button');
				btn.classList.add('option');
				btn.innerText = name(i);
				const v = value(i);
				btn.dataset.value = v;
				btn.onclick = () => func(v);
				list.appendChild(btn);
			}
		}

		if (code)
			if (window.cfg?.init) init(window.cfg?.init);
			else api('/list').then(data => init(data.list));
	</script>
</body>
</html>
